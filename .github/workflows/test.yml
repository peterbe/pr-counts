name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# env:
# DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # - run: 'echo "DATABASE_URL: ${DATABASE_URL}"'
      # https://github.com/bmizerany/setup-postgres/issues/6
      - run: mkdir -p $HOME/.local
      # https://github.com/bmizerany/setup-postgres?tab=readme-ov-file#environment-configuration
      - uses: bmizerany/setup-postgres@v3
      # XXX explain
      - run: 'echo "DATABASE_URL=postgres://postgres:postgres@localhost:5432/postgres" >> "$GITHUB_ENV"'
      - run: 'echo "DATABASE_URL: ${DATABASE_URL}"'
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bun run --filter scraper migrate
      - run: bun run --filter scraper by-config .github/workflows/test-config.json
      - run: bun run --filter webapp build
